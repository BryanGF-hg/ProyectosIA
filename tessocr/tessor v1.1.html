<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Batch OCR → JSON</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
  font-family: system-ui, Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 2rem;
}

#dropzone {
  border: 2px dashed #38bdf8;
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  background: #020617;
  cursor: pointer;
}

#dropzone.dragover {
  background: #082f49;
}

button {
  background: #38bdf8;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

pre {
  background: #020617;
  padding: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
  max-height: 300px;
  overflow: auto;
}
</style>
</head>

<body>

<h1>OCR por lotes → JSON</h1>

<div id="dropzone">
  Arrastra imágenes o carpetas aquí<br><br>
  <input type="file" id="fileInput" multiple webkitdirectory hidden>
  <button onclick="fileInput.click()">Seleccionar</button>
</div>

<h3>Estado</h3>
<div id="status"></div>

<h3>Resultado JSON</h3>
<pre id="output"></pre>

<button id="downloadBtn" disabled>Descargar JSON</button>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const statusEl = document.getElementById("status");
const outputEl = document.getElementById("output");
const downloadBtn = document.getElementById("downloadBtn");

let results = [];

/* DRAG & DROP */
dropzone.addEventListener("dragover", e => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener("change", e => handleFiles(e.target.files));

async function handleFiles(fileList) {
  results = [];
  outputEl.textContent = "";
  statusEl.innerHTML = "";

  const files = [...fileList].filter(f => f.type.startsWith("image/"));
  for (const file of files) {
    await ocrImage(file);
  }

  outputEl.textContent = JSON.stringify(results, null, 2);
  downloadBtn.disabled = false;
}

async function ocrImage(file) {
  const row = document.createElement("div");
  row.textContent = `⏳ Procesando ${file.name}`;
  statusEl.appendChild(row);

  const { data } = await Tesseract.recognize(
    file,
    "eng",
    {
      logger: m => {
        if (m.status === "recognizing text") {
          row.textContent = `📖 ${file.name} (${Math.round(m.progress * 100)}%)`;
        }
      }
    }
  );

  results.push(parseText(data.text, file.name));
  row.textContent = `✅ ${file.name}`;
}

/* TEXTO → JSON */
function parseText(text, source) {
  return {
    artist: extract(text, /artist\s*[:\-]\s*(.+)/i),
    stand: extract(text, /stand\s*[:\-]\s*(.+)/i),
    note: extract(text, /note\s*[:\-]\s*(.+)/i) || text.trim(),
    source
  };
}

function extract(text, regex) {
  const m = text.match(regex);
  return m ? m[1].trim() : "";
}

/* DESCARGA */
downloadBtn.onclick = () => {
  const blob = new Blob(
    [JSON.stringify(results, null, 2)],
    { type: "application/json" }
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ocr.json";
  a.click();
};
</script>

</body>
</html>
